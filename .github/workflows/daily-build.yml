name: Daily Docker Image Build

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "package.json"
      - "bun.lockb"
      - "tsconfig.json"
      - "entrypoint.sh"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE_NAME: oasm/dbip
  CONTAINER_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to image repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image with daily updated databases
        run: |
          # Get current date in DDMMYY format
          DATE_TAG=$(date +'%y%m%d')
          TAGS=(latest ${GITHUB_SHA::7} ${DATE_TAG})
          TAG_ARGS=()
          for IMAGE in ${{ env.IMAGE_NAME }} ${{ env.DOCKERHUB_IMAGE_NAME }}; do
            for TAG in "${TAGS[@]}"; do
              TAG_ARGS+=(--tag "${IMAGE}:${TAG}")
            done
          done
          docker build --platform linux/amd64 "${TAG_ARGS[@]}" --file ./Dockerfile .
          for IMAGE in ${{ env.IMAGE_NAME }} ${{ env.DOCKERHUB_IMAGE_NAME }}; do
            for TAG in "${TAGS[@]}"; do
              docker push "${IMAGE}:${TAG}"
            done
          done

      - name: Extract DB-IP DB build date from image
        id: dbdate
        run: |
          # Copy the freshly downloaded .mmdb files out of the built image
          docker create --name geoip-tmp ${{ env.IMAGE_NAME }}:latest
          mkdir -p ./geoip-dbs
          docker cp geoip-tmp:/usr/share/GeoIP/. ./geoip-dbs/
          docker rm geoip-tmp
          ls -l ./geoip-dbs
          # Read build_epoch metadata from every DB and take the newest —
          # this only changes when DB-IP ships a new monthly release.
          pip install --quiet maxminddb
          EPOCH=$(python3 <<'PY'
          import glob
          import maxminddb
          def epoch_of(path):
              r = maxminddb.open_database(path)
              md = r.metadata() if callable(getattr(r, "metadata", None)) else r.metadata
              return md["build_epoch"] if isinstance(md, dict) else md.build_epoch
          print(max(epoch_of(f) for f in glob.glob("./geoip-dbs/*.mmdb")))
          PY
          )
          DB_DATE=$(date -u -d "@${EPOCH}" +%F)
          echo "DB build epoch ${EPOCH} -> ${DB_DATE}"
          echo "db_date=${DB_DATE}" >> "$GITHUB_OUTPUT"

      - name: Update README with DB-IP DB date
        run: |
          LINE="> 📅 DB-IP Lite databases last updated: **${{ steps.dbdate.outputs.db_date }}**"
          # Also matches the legacy GeoLite2 line so it gets replaced once.
          if grep -qE "(GeoLite2|DB-IP Lite) databases last updated" README.md; then
            sed -i -E "s#^> 📅 (GeoLite2|DB-IP Lite) databases last updated.*\$#${LINE}#" README.md
          else
            awk -v line="$LINE" 'NR==1{print; print ""; print line; next}1' README.md > README.tmp && mv README.tmp README.md
          fi
          git diff README.md || true

      - name: Commit README if DB date changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # No-op when DB-IP shipped no new data: build_epoch unchanged,
          # README untouched, nothing committed. (README.md is outside the
          # push trigger paths, so this push never re-triggers the build.)
          if git diff --cached --quiet; then
            echo "README unchanged, DB date ${{ steps.dbdate.outputs.db_date }} already recorded."
          else
            git commit -m "docs: DB-IP Lite DBs updated to ${{ steps.dbdate.outputs.db_date }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
